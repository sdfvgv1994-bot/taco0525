# 雲端版全球股市看板＋雲端看盤：GitHub 的雲端機器每 15 分鐘抓一次資料，產生網頁放到 GitHub Pages。
# 全球看板：https://sdfvgv1994-bot.github.io/taco0525/
# 雲端看盤：https://sdfvgv1994-bot.github.io/taco0525/monitor/
# 台股總覽：https://sdfvgv1994-bot.github.io/taco0525/tw/
#   設定在 cloud_monitor/config.toml；帳戶等資料存在 monitor-data 分支（每次執行後存回去）
name: 更新雲端看板

on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub 排程偶爾會晚幾分鐘
  workflow_dispatch:            # 也可以在 Actions 頁面手動執行
  push:
    branches: [main]
    paths:
      - "world_market/**"
      - "common/**"
      - "cloud_monitor/**"
      - "stock_monitor/**"
      - "tw_market/**"
      - ".github/workflows/board.yml"

permissions:
  contents: write     # 雲端看盤要把帳戶資料存回 monitor-data 分支
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 雲端看盤那幾步「出錯也繼續」，工作不會變紅；把結果交給後面的 alert 工作判斷要不要通知
    outputs:
      state: ${{ steps.state.outcome }}
      monitor: ${{ steps.monitor.outcome }}
      save: ${{ steps.save.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: world_market/requirements-board.txt

      - run: pip install -r world_market/requirements-board.txt

      # 證交所的歷史資料存在快取：過去的月份不用再抓，也比較不會被證交所封鎖
      - uses: actions/cache@v4
        with:
          path: .cache/twse
          key: twse-${{ github.run_id }}
          restore-keys: twse-

      # 上一次成功抓到的走勢：這次抓不到（例如 Yahoo 限流）時沿用，不會讓網頁少了走勢圖
      - uses: actions/cache@v4
        with:
          path: .cache/board_history
          key: board-history-${{ github.run_id }}
          restore-keys: board-history-

      # 台股總覽的每日資料（行情、法人、融資融券）：過去的日子存了就不再抓，第一天要分好幾次補齊。
      # 這裡只取出；有新資料才存（後面的「存台股總覽的快取」），不然每 15 分鐘存一份 20 多 MB，
      # 幾天就把 GitHub 的快取空間用完。
      # 路徑要寫 .cache/tw/*（不是 .cache/tw）：寫資料夾的話整個資料夾都會打包，排除 status.json 那行沒有作用。
      # 這兩行要和「存台股總覽的快取」一字不差（快取的版本是用這幾行算的，不一樣就取不出來）
      - name: 取出台股總覽的快取
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/tw/*
            !.cache/tw/status.json
          key: tw-data-${{ github.run_id }}
          restore-keys: tw-data-

      # 台股總覽抓資料的紀錄（最後一次確認資料是最新的時間等，很小）：每次都存
      - uses: actions/cache@v4
        with:
          path: .cache/tw/status.json
          key: tw-status-${{ github.run_id }}
          restore-keys: tw-status-

      - name: 產生看板網頁
        run: python world_market/build_static.py --out _site

      # ---------------- 雲端看盤（出錯也不影響全球看板發佈） ----------------
      # 分支不存在（第一次執行）才建新的；網路等其他錯誤就讓這一步失敗，不要從空帳戶重來
      - name: 取出雲端看盤的資料（monitor-data 分支）
        id: state
        continue-on-error: true
        run: |
          rc=0
          git ls-remote --exit-code --heads origin monitor-data > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch --depth=1 origin monitor-data:monitor-data
            git worktree add _state monitor-data
          elif [ "$rc" = 2 ]; then
            echo "第一次執行：建立新的 monitor-data 分支"
            git worktree add --orphan -b monitor-data _state
          else
            echo "::error::查詢 monitor-data 分支失敗（代碼 $rc），這次不執行雲端看盤"
            exit 1
          fi

      - name: 雲端看盤
        id: monitor
        if: steps.state.outcome == 'success'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}      # 手機推播的頻道名稱（在 GitHub 的 Secrets 設定）
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}       # Telegram 機器人（BotFather 給的 Token）
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_monitor/run.py --state _state --out _site/monitor

      # 看盤程式中途出錯也要存：出錯前可能已經成交，沒存的話下一次會再做一次
      - name: 存回雲端看盤的資料
        id: save
        if: steps.state.outcome == 'success'
        continue-on-error: true
        working-directory: _state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "雲端看盤 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push -q origin monitor-data

      # 讀不到帳戶、程式出錯或存檔失敗：改放上一次的網頁（標示這次失敗），/monitor/ 不會變成 404
      - name: 雲端看盤沒成功時，保留上一次的網頁
        if: steps.monitor.outcome != 'success' || steps.save.outcome != 'success'
        continue-on-error: true
        run: >-
          python cloud_monitor/keep_last.py --out _site/monitor
          --state "${{ steps.state.outcome }}" --monitor "${{ steps.monitor.outcome }}"
          --save "${{ steps.save.outcome }}"

      # ---------------- 台股總覽（出錯也不影響其他網頁發佈） ----------------
      # 每次最多連每個網站 25 次、抓 4 分鐘，抓不完的下次繼續。
      # exec：超時的時候 GitHub 只對這一步的 shell 送停止訊號，沒有 exec 的話 python 會留在背景繼續跑，
      # 和後面「用快取的資料重新產生」、存快取、上傳網頁同時改同一批檔案
      - name: 產生台股總覽
        id: tw
        continue-on-error: true
        timeout-minutes: 12
        run: exec python -m tw_market.build --out _site/tw

      # 抓資料出錯或超時：不連網，只用快取裡已經有的資料重新產生（網頁上註明這次抓資料失敗），
      # /tw/ 不會變成 404
      - name: 台股總覽沒成功時，用快取的資料重新產生
        id: tw_cached
        if: steps.tw.outcome != 'success'
        continue-on-error: true
        run: python -m tw_market.build --out _site/tw --no-fetch --fetch-failed

      # 快取有變動（新抓到資料、記下休市日、清掉舊檔）才存；中途出錯也會存已經抓到的
      - name: 存台股總覽的快取
        if: steps.tw.outputs.changed == 'true' || steps.tw_cached.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/tw/*
            !.cache/tw/status.json
          key: tw-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------- 壞掉／恢復時通知老闆（n8n → Telegram） ----------------
  # 只在狀態「改變」時才敲 n8n：一直正常、一直壞著都不會每 15 分鐘通知一次。
  # 上一次的狀態用快取保存（很小）。台股總覽抓資料失敗很常見、也會自己補，不在通知範圍。
  # 入口網址放在 Secrets 的 N8N_BOARD_WEBHOOK；沒設就只記狀態、不通知。
  alert:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud_monitor/board_alert.py
          sparse-checkout-cone-mode: false

      - uses: actions/cache@v4
        with:
          path: .cache/board_alert
          key: board-alert-${{ github.run_id }}
          restore-keys: board-alert-

      - name: 狀態改變就通知
        env:
          N8N_BOARD_WEBHOOK: ${{ secrets.N8N_BOARD_WEBHOOK }}
        run: >-
          python3 cloud_monitor/board_alert.py
          --build "${{ needs.build.result }}" --deploy "${{ needs.deploy.result }}"
          --state "${{ needs.build.outputs.state }}" --monitor "${{ needs.build.outputs.monitor }}"
          --save "${{ needs.build.outputs.save }}"
          --status-file .cache/board_alert/status.json
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
