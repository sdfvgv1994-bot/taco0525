# ─────────────────────────────────────────────────────────────
#  雲端看盤設定
#  在 GitHub 網頁（手機也可以）按右上角鉛筆圖示修改，按「Commit changes」存檔，
#  下一次雲端更新（15 分鐘內）就會套用。打錯格式也沒關係，網頁上會顯示哪裡錯，
#  並先沿用上一次正確的設定。
#  以 # 開頭的是說明，不會被讀取。
# ─────────────────────────────────────────────────────────────

# 自選股：台股打數字（上市上櫃都可以），美股打英文代號，指數可以打「加權」，加密貨幣打 BTC
watchlist = ["2330", "0050", "2454", "2317", "AAPL", "NVDA"]

[settings]
# 策略（第一個是「主策略」，自動交易只跟它；其他的只顯示訊號）
#   ma 均線交叉、macd MACD、rsi RSI 超買超賣、kd KD 指標、bbands 布林通道、breakout 突破新高
strategies = ["ma", "macd"]

auto_trade = true          # 自動模擬交易：true 開、false 關
auto_buy_amount = 100000   # 主策略出現買進訊號時，每次買進的金額
stop_loss_pct = 8          # 持股虧損超過幾 % 就停損賣出（0 = 不停損）
short_ma = 5               # 均線策略與報價表用的短均線天數
long_ma = 20               # 長均線天數

# 價格上下限提醒（不需要就刪掉或在前面加 #）
[limits]
"2330" = { lower = 1800, upper = 3000 }
# "AAPL" = { upper = 400 }

# 策略參數（不寫就用預設值）
[strategy_params]
# rsi = { low = 25, high = 75 }
# kd = { low = 20, high = 80 }
