<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的看盤">
<title>我的雲端看盤</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ef;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6; --rise: #d03b3b; --fall: #006300; --flat: #898781;
  --open: #0ca30c; --warn-bg: #fff4d6; --warn-ink: #6b4b00;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --rise: #e66767; --fall: #0ca30c;
    --warn-bg: #3a2f12; --warn-ink: #f5d68a; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --accent: #3987e5; --rise: #e66767; --fall: #0ca30c;
  --warn-bg: #3a2f12; --warn-ink: #f5d68a; --shadow: none;
}
:root[data-colors="intl"] { --rise-x: var(--fall); --fall-x: var(--rise); }
:root:not([data-colors="intl"]) { --rise-x: var(--rise); --fall-x: var(--fall); }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.updated { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--ink);
  display: inline-block;
}
.btn:hover { background: var(--surface-2); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.banner.error { border: 1px solid currentColor; }
.banner ul { margin: 4px 0 0; padding-left: 20px; }
.notes { color: var(--ink-2); font-size: 13px; margin: 0 0 12px; padding-left: 18px; }
section.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.tile .k { color: var(--muted); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; }
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; width: 100%; height: 160px; }
.tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  white-space: nowrap; display: none;
}
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
.scroll { overflow-x: auto; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .name { font-weight: 650; }
.card a.name { color: inherit; text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 3px; }
.card a.name:hover { text-decoration: underline; }
.card .price { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.card .meta { color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border); }
.chip.buy { color: var(--rise-x); border-color: currentColor; }
.chip.sell { color: var(--fall-x); border-color: currentColor; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--axis); }
.pill.open { color: var(--ink-2); }
.pill.open .dot { background: var(--open); }
.rise { color: var(--rise-x); } .fall { color: var(--fall-x); } .flat { color: var(--flat); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 6px 0; border-bottom: 1px solid var(--grid); }
.list .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-right: 6px; }
.empty { color: var(--muted); padding: 8px 0; }
dl.settings { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 10px; }
dl.settings dt { color: var(--muted); }
dl.settings dd { margin: 0; }
.foot { color: var(--muted); font-size: 12px; }
/* 編輯自選股 */
details.editor > summary { cursor: pointer; font-weight: 650; list-style: none; }
details.editor > summary::-webkit-details-marker { display: none; }
details.editor > summary::before { content: "▸ "; color: var(--muted); }
details.editor[open] > summary::before { content: "▾ "; }
.ed-rows { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
.ed-row { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid;
  grid-template-columns: minmax(90px, 1.2fr) repeat(3, minmax(70px, 1fr)) auto; gap: 6px; align-items: end; }
.ed-row .code { font-weight: 650; align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-row .code small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.ed-row label, .ed-add label, .ed-token label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; }
.ed input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; min-width: 0; width: 100%; }
.ed .del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 6px; align-self: center; }
.ed-add, .ed-actions { display: flex; gap: 6px; align-items: end; flex-wrap: wrap; }
.ed-add input { width: 160px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.ed-msg { margin: 8px 0 0; font-size: 13px; }
.ed-msg.ok { color: var(--open); } .ed-msg.err { color: var(--rise); }
.od-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 12px 0 6px; }
.od-form label { display: flex; flex-direction: column; font-size: 11px; color: var(--muted); gap: 2px; }
.od-form select, .od-form input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; min-width: 0; }
.od-side { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.od-side button { border: none; background: var(--surface); padding: 6px 14px; cursor: pointer; }
.od-side button.on.buy { background: var(--rise-x); color: #fff; }
.od-side button.on.sell { background: var(--fall-x); color: #fff; }
.od-est { font-size: 12px; color: var(--ink-2); }
.od-list { list-style: none; margin: 10px 0 0; padding: 0; }
.od-list li { padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
.od-st { font-size: 12px; border-radius: 999px; padding: 0 8px; border: 1px solid currentColor; white-space: nowrap; }
.od-st.done { color: var(--open); } .od-st.pending, .od-st.sent { color: var(--accent); }
.od-st.rejected, .od-st.expired { color: var(--rise); }
.ed-token { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.ed-token ol { margin: 6px 0; padding-left: 20px; }
.ed-token a { color: inherit; }
@media (max-width: 560px) {
  .ed-row { grid-template-columns: 1fr 1fr 1fr auto; }
  .ed-row .code { grid-column: 1 / -1; }
}
@media (max-width: 560px) {
  .tile .v { font-size: 18px; }
  /* 手機：按鈕自己一行、靠左排，字小一點，四個按鈕排得下一行 */
  .links { flex-basis: 100%; gap: 5px; }
  .links .btn { padding: 5px 8px; font-size: 13px; }
}
@media (max-width: 400px) {
  .links { gap: 4px; }
  .links .btn { padding: 5px 6px; }
  .links .long { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的雲端看盤</h1>
    <span class="updated" id="updated">載入中…</span>
    <span class="spacer"></span>
    <nav class="links" aria-label="其他頁面與設定">
      <a class="btn" href="../">🌏 全球看板</a>
      <a class="btn" href="../tw/">🇹🇼 台股<span class="long">總覽</span></a>
      <a class="btn" id="editBtn" href="#" target="_blank" rel="noopener">⚙️ 修改設定</a>
      <button class="btn" id="colorBtn">紅漲綠跌</button>
    </nav>
  </header>
  <div id="banner"></div>
  <ul class="notes" id="notes"></ul>

  <section class="panel">
    <h2>模擬帳戶</h2>
    <div class="tiles" id="tiles"></div>
    <div class="chart" id="equity"></div>
  </section>

  <section class="panel">
    <h2>持股</h2>
    <div class="scroll" id="positions"></div>
  </section>

  <section class="panel">
    <h2>自選股</h2>
    <div class="cards" id="watch"></div>
  </section>

  <section class="panel ed">
    <details class="editor" id="editor">
      <summary>✏️ 新增 / 刪除自選股、設定上下限與支撐線</summary>
      <div id="edBody"><p class="empty">載入中…</p></div>
    </details>
  </section>

  <section class="panel ed">
    <details class="editor" id="orderPanel">
      <summary>🛒 手動模擬下單</summary>
      <div id="odBody"><p class="empty">載入中…</p></div>
    </details>
  </section>

  <section class="panel">
    <h2>提醒紀錄</h2>
    <ul class="list" id="alerts"></ul>
  </section>

  <section class="panel">
    <h2>交易紀錄</h2>
    <div class="scroll" id="trades"></div>
  </section>

  <section class="panel">
    <h2>目前設定</h2>
    <dl class="settings" id="settings"></dl>
    <a class="btn" id="editBtn2" href="#" target="_blank" rel="noopener">⚙️ 在 GitHub 修改設定</a>
    <p class="foot">改完按「Commit changes」存檔，15 分鐘內套用。只在各市場的交易時間內判斷訊號、自動交易。
      這是公開網頁，模擬帳戶是虛擬的錢。</p>
  </section>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let data = null, lastError = null;
const KIND_ICON = { buy: "🟢", sell: "🔴", above: "⬆️", below: "⬇️", stop: "🛑", trail: "📉", support: "🔻" };

function pref(key, val) {
  try {
    if (val === undefined) return localStorage.getItem("wm." + key);
    localStorage.setItem("wm." + key, val);
  } catch (e) { return null; }
}
function applyPrefs() {
  const colors = pref("colors") || "tw";
  document.documentElement.dataset.colors = colors;
  $("colorBtn").textContent = colors === "tw" ? "紅漲綠跌" : "綠漲紅跌";
  const theme = pref("theme") || "auto";
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
}
$("colorBtn").onclick = () => { pref("colors", (pref("colors") || "tw") === "tw" ? "intl" : "tw"); applyPrefs(); };

function el(tag, attrs = {}, text) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}
function svg(tag, attrs = {}) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
function fmt(v, d = 2) {
  if (v == null || isNaN(v)) return "—";
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
const dirClass = (v) => (v > 0 ? "rise" : v < 0 ? "fall" : "flat");
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "–");
const pct = (v) => (v == null ? "—" : `${arrow(v)} ${v > 0 ? "+" : ""}${Number(v).toFixed(2)}%`);
const money = (v) => fmt(v, 0);
const wan = (v) => `${(v / 10000).toFixed(v >= 1e6 ? 1 : 2).replace(/\.?0+$/, "")} 萬`;   // 圖上標籤用「萬」比較短

// ---------- 交易時間（瀏覽器當下時間） ----------
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function zoned(tz) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, weekday: "short", hour: "2-digit", minute: "2-digit" });
  const p = Object.fromEntries(f.formatToParts(new Date()).map((x) => [x.type, x.value]));
  return { wd: WEEKDAYS.indexOf(p.weekday), mins: ((+p.hour) % 24) * 60 + (+p.minute) };
}
const toMins = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function exStatus(key) {
  const ex = data && data.exchanges && data.exchanges[key];
  if (!ex) return "closed";
  const t = zoned(ex.tz);
  if (ex.always === "24/7") return "open";
  if (ex.always === "24/5") return (t.wd === 5 || (t.wd === 6 && t.mins < 1020) || (t.wd === 4 && t.mins >= 1020)) ? "closed" : "open";
  if (t.wd >= 5) return "closed";
  return ex.sessions.some(([a, b]) => toMins(a) <= t.mins && t.mins < toMins(b)) ? "open" : "closed";
}

// ---------- 畫面 ----------
function showUpdated() {
  const err = lastError ? `⚠ 更新失敗：${lastError}　` : "";
  if (!data) { $("updated").textContent = err || "載入中…"; return; }
  const mins = Math.max(0, Math.round((Date.now() - Date.parse(data.updated_utc)) / 60000));
  const ago = mins < 1 ? "剛剛" : mins < 60 ? `${mins} 分鐘前` : `${Math.floor(mins / 60)} 小時 ${mins % 60} 分鐘前`;
  $("updated").textContent = `${err}資料時間 ${data.updated.slice(5, 16)}（台北，${ago}）` +
    (!err && mins > 90 ? "　⚠ 雲端更新可能暫停了" : "");
}

function render() {
  $("editBtn").href = $("editBtn2").href = data.edit_url;
  // 設定錯誤
  const b = $("banner"); b.replaceChildren();
  if (data.run_error) b.append(el("div", { class: "banner error" }, "⚠ " + data.run_error));
  if (data.config_errors.length) {
    const box = el("div", { class: "banner" }, "⚠ 設定檔有問題：");
    const ul = el("ul");
    data.config_errors.forEach((e) => ul.append(el("li", {}, e)));
    box.append(ul); b.append(box);
  }
  const notes = $("notes"); notes.replaceChildren();
  data.notes.forEach((n) => notes.append(el("li", {}, n)));

  // 帳戶
  const a = data.account;
  const tiles = [["總資產", money(a.total), ""], ["報酬率", pct(a.return_pct), dirClass(a.return_pct)],
                 ["現金", money(a.cash), ""], ["持股市值", money(a.market_value), ""]];
  $("tiles").replaceChildren(...tiles.map(([k, v, c]) => {
    const t = el("div", { class: "tile" });
    t.append(el("div", { class: "k" }, k), el("div", { class: "v " + c }, v));
    return t;
  }));
  equityChart($("equity"), data.equity, a.initial);

  // 持股
  if (!data.positions.length) $("positions").replaceChildren(el("div", { class: "empty" }, "目前沒有持股"));
  else {
    const t = el("table");
    const h = el("tr");
    ["股票", "股數", "成本", "現價", "損益", "%"].forEach((x) => h.append(el("th", {}, x)));
    t.append(h);
    for (const p of data.positions) {
      const r = el("tr");
      r.append(el("td", {}, `${p.code} ${p.name}`), el("td", {}, fmt(p.shares, 0)), el("td", {}, fmt(p.avg_cost)),
               el("td", p.price_time ? { title: `這次抓不到報價，用 ${p.price_time} 的價格` } : {},
                  fmt(p.price) + (p.price_time ? " ⚠" : "")),
               el("td", { class: dirClass(p.pnl) }, money(p.pnl)),
               el("td", { class: dirClass(p.pnl_pct) }, pct(p.pnl_pct)));
      t.append(r);
    }
    $("positions").replaceChildren(t);
  }

  // 自選股
  if (!data.watch.length) $("watch").replaceChildren(el("div", { class: "empty" }, "自選股是空的，在下面「✏️ 新增 / 刪除自選股」加入"));
  else $("watch").replaceChildren(...data.watch.map(watchCard));
  if ($("editor").open && ED.text == null && !ED.busy) edLoad();
  if ($("orderPanel").open && !OD.busy && !$("odBody").contains(document.activeElement)) drawOrders();

  // 提醒
  const al = $("alerts"); al.replaceChildren();
  if (!data.alerts.length) al.append(el("li", { class: "empty" }, "還沒有提醒"));
  for (const x of data.alerts) {
    const li = el("li");
    li.append(el("span", { class: "t" }, x.time.slice(5, 16)), document.createTextNode(`${KIND_ICON[x.kind] || "•"} ${x.message}`));
    al.append(li);
  }

  // 交易
  if (!data.trades.length) $("trades").replaceChildren(el("div", { class: "empty" }, "還沒有交易"));
  else {
    const t = el("table");
    const h = el("tr");
    ["時間", "買賣", "股票", "股數", "價格", "金額", "損益", "原因"].forEach((x) => h.append(el("th", {}, x)));
    t.append(h);
    for (const x of data.trades) {
      const r = el("tr");
      r.append(el("td", {}, x.time.slice(5, 16)), el("td", { class: x.side === "買進" ? "rise" : "fall" }, x.side),
               el("td", {}, x.code), el("td", {}, fmt(x.shares, 0)), el("td", {}, fmt(x.price)),
               el("td", {}, money(x.cash_flow)), el("td", { class: dirClass(x.pnl || 0) }, x.pnl == null ? "" : money(x.pnl)),
               el("td", {}, x.reason));
      t.append(r);
    }
    $("trades").replaceChildren(t);
  }

  // 設定
  const s = data.settings, dl = $("settings"); dl.replaceChildren();
  const rows = [["主策略", s.strategies[0] ? s.strategies[0].name : "—"],
                ["其他策略", s.strategies.slice(1).map((x) => x.name).join("、") || "—"],
                ["自動交易", s.auto_trade ? `開（每次買 ${money(s.auto_buy_amount)}）` : "關"],
                ["停損", s.stop_loss_pct ? `虧損 ${s.stop_loss_pct}% 賣出` : "不停損"],
                ["移動停損", s.trail_stop_pct ? `從最高價回落 ${s.trail_stop_pct}% 賣出` : "不使用"],
                ["均線", `MA${s.short_ma} / MA${s.long_ma}`],
                ["手機推播", s.notify ? s.notify.status + (s.notify.enabled && s.notify.status.startsWith("已開啟")
                  ? `（訊號：${{ primary: "只有主策略", all: "全部策略", none: "不通知" }[s.notify.signals]}）` : "") : "—"]];
  for (const [k, v] of rows) dl.append(el("dt", {}, k), el("dd", {}, v));
}

// 台股個股（4～6 碼，可能帶 .TW / .TWO；不含 ^TWII 這類指數）→ 台股總覽的代號
function twCode(w) {
  const m = w.tw && /^(\d{4,6}[A-Z]?)(\.TWO?)?$/i.exec(String(w.code || "").trim());
  return m ? m[1].toUpperCase() : null;
}

function watchCard(w) {
  const c = el("div", { class: "card" });
  const top = el("div", { class: "top" });
  const tw = twCode(w);
  const name = tw ? el("a", { class: "name", href: `../tw/#${tw}`, title: "在台股總覽看詳細資料" }, `${w.name || w.code}`)
                  : el("span", { class: "name" }, `${w.name || w.code}`);
  top.append(name, el("span", { class: "meta" }, w.name ? w.code : ""));
  c.append(top);
  if (w.error) { c.append(el("div", { class: "meta" }, "⚠ " + w.error)); return c; }
  const star = w.tw && !w.live ? " *" : "";
  c.append(el("div", { class: "price" }, fmt(w.price) + star));
  c.append(el("div", { class: dirClass(w.change_pct) }, pct(w.change_pct)));
  const trend = w.trend === "多" ? "多頭" : w.trend === "空" ? "空頭" : "資料不足";
  c.append(el("div", { class: "meta" }, `MA${data.settings.short_ma} ${fmt(w.short_ma)}　MA${data.settings.long_ma} ${fmt(w.long_ma)}　RSI ${fmt(w.rsi, 0)}　${trend}`));
  if (w.stale && w.bar_date) c.append(el("div", { class: "meta" }, `⚠ 還沒有今天的資料，顯示 ${w.bar_date.slice(5).replace("-", "/")} 的收盤`));
  const chips = el("div", { class: "chips" });
  for (const sg of w.signals) chips.append(el("span", { class: "chip " + (sg.dir > 0 ? "buy" : "sell"), title: sg.reason }, `${sg.dir > 0 ? "買" : "賣"}・${sg.name}`));
  if (w.held) chips.append(el("span", { class: "chip" }, w.held_only ? "持股中（已移出自選股）" : "持股中"));
  const lim = w.limits || {};
  if (lim.lower != null || lim.upper != null) chips.append(el("span", { class: "chip" }, `提醒 ${lim.lower ?? "—"}～${lim.upper ?? "—"}`));
  if (lim.support && lim.support.length) chips.append(el("span", { class: "chip" }, `支撐 ${lim.support.join("、")}`));
  if (chips.childNodes.length) c.append(chips);
  const st = exStatus(w.exchange);
  const p = el("span", { class: "pill" + (st === "open" ? " open" : "") });
  const exName = (data.exchanges[w.exchange] || {}).name;
  p.append(el("span", { class: "dot" }), document.createTextNode(
    !exName ? "不知道交易時間，只顯示報價" : `${exName} ${st === "open" ? "交易時間" : "休市"}`));
  c.append(p);
  return c;
}

function equityChart(box, pts, initial) {
  box.replaceChildren();
  if (!pts || pts.length < 2) { box.append(el("div", { class: "empty" }, "資產走勢會在累積幾次更新後出現")); return; }
  const W = Math.max(300, box.clientWidth), H = 160, m = { l: 6, r: 70, t: 10, b: 20 };
  const vals = pts.map((p) => p[1]), n = vals.length;
  let lo = Math.min(...vals, initial), hi = Math.max(...vals, initial);
  const pad = (hi - lo) * 0.1 || hi * 0.01 || 1; lo -= pad; hi += pad;
  const X = (i) => m.l + i / (n - 1) * (W - m.l - m.r), Y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "模擬帳戶總資產走勢" });
  s.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(initial), y2: Y(initial), stroke: "var(--axis)", "stroke-dasharray": "3 3" }));
  const lbl = svg("text", { class: "tick", x: W - m.r + 6, y: Y(initial) + 4 }); lbl.textContent = "本金 " + wan(initial); s.append(lbl);
  const last = vals[n - 1], color = last > initial ? "var(--rise-x)" : last < initial ? "var(--fall-x)" : "var(--flat)";
  const line = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  s.append(svg("polyline", { points: line, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
  const endLbl = svg("text", { class: "tick", x: W - m.r + 6, y: Y(last) + 4 }); endLbl.textContent = wan(last); s.append(endLbl);
  const d0 = svg("text", { class: "tick", x: m.l, y: H - 4 }); d0.textContent = pts[0][0].slice(5, 10); s.append(d0);
  const d1 = svg("text", { class: "tick", x: W - m.r, y: H - 4, "text-anchor": "end" }); d1.textContent = pts[n - 1][0].slice(5, 10); s.append(d1);
  const dot = svg("circle", { r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  s.append(dot);
  const tip = el("div", { class: "tip" });
  const hit = svg("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" });
  const move = (cx) => {
    const r = s.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round(((cx - r.left) * W / r.width - m.l) / (W - m.l - m.r) * (n - 1))));
    dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(vals[i])); dot.setAttribute("visibility", "visible");
    const t = new Date(pts[i][0]);
    tip.textContent = `${t.toLocaleString("zh-TW", { timeZone: "Asia/Taipei", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })}　${money(vals[i])}`;
    tip.style.display = "block";
    const left = X(i) * r.width / W;
    tip.style.left = (left > r.width / 2 ? left - tip.offsetWidth - 10 : left + 10) + "px";
    tip.style.top = "0px";
  };
  hit.addEventListener("mousemove", (e) => move(e.clientX));
  hit.addEventListener("touchmove", (e) => { move(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; dot.setAttribute("visibility", "hidden"); });
  s.append(hit);
  box.append(s, tip);
}

async function load() {
  try {
    const r = await fetch(`data.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status === 404 ? "雲端看盤還沒產生資料，請等下一次更新" : `讀取失敗（${r.status}）`);
    const got = await r.json();
    if (got.fatal) throw new Error(got.fatal);   // 雲端這次失敗、也沒有上一次的資料
    data = got;
    lastError = null;
    render();
  } catch (e) {
    lastError = e.message;
  }
  showUpdated();
}
// ---------- 在網頁上編輯自選股：直接改 GitHub 上的 cloud_monitor/config.toml ----------
// 存檔 = 在 GitHub 上提交一次修改，會自動觸發雲端重新計算（約 2 分鐘）。
// 需要一組只能改這個倉庫的 GitHub 權杖，只存在這個瀏覽器（localStorage），不會放進網頁或倉庫。
const ED = { text: null, sha: null, rows: [], busy: false, msg: "", msgKind: "", needToken: false };
const TOKEN_KEY = "monitorGhToken";
function token(v) {
  try {
    if (v === undefined) return localStorage.getItem(TOKEN_KEY) || "";
    if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY);
  } catch (e) { return ""; }
  return v;
}
function repoInfo() {
  const m = data && /github\.com\/([^/]+)\/([^/]+)\/edit\/([^/]+)\/(.+)$/.exec(data.edit_url || "");
  return m && { owner: m[1], repo: m[2], branch: m[3], path: m[4] };
}
const b64dec = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
function b64enc(s) {
  let bin = "";
  for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b);
  return btoa(bin);
}
async function gh(method, body, path) {
  const r = repoInfo();
  if (!r) throw new Error("找不到 GitHub 倉庫的位置");
  const url = `https://api.github.com/repos/${r.owner}/${r.repo}/contents/${path || r.path}` +
    (method === "GET" ? `?ref=${r.branch}&t=${Date.now()}` : "");
  const headers = { Accept: "application/vnd.github+json" };
  if (token()) headers.Authorization = `Bearer ${token()}`;
  const res = await fetch(url, { method, headers, cache: "no-store", body: body ? JSON.stringify({ ...body, branch: r.branch }) : undefined });
  const j = await res.json().catch(() => ({}));
  if (res.ok) return j;
  if (res.status === 404 && method === "GET" && path) return null;   // 檔案還沒建立
  if (res.status === 401) { ED.needToken = true; throw new Error("權杖錯誤或已過期，請重新貼上一組"); }
  if (res.status === 403 || res.status === 404) { ED.needToken = true; throw new Error("這組權杖不能修改 taco0525（建立時 Contents 要選「Read and write」，倉庫要選 taco0525）"); }
  if (res.status === 409) throw new Error("設定剛剛在別的地方被改過了，請按「重新載入」再改一次");
  throw new Error(`GitHub 回應 ${res.status}：${j.message || ""}`);
}
// 手機輸入法的全形符號當半形看（一個字換一個字，位置不變，才能拿來切原本的文字）
const norm = (t) => t.replace(/[“”„＂]/g, '"').replace(/[‘’＇]/g, "'").replace(/，/g, ",").replace(/＝/g, "=")
  .replace(/［/g, "[").replace(/］/g, "]").replace(/｛/g, "{").replace(/｝/g, "}").replace(/．/g, ".")
  .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48));
function limitsRange(t) {   // [limits] 段落內容的位置（標題那行之後到下一個 [段落] 之前）
  const h = /^[ \t]*\[limits\][^\n]*$/m.exec(t);
  if (!h) return null;
  const start = h.index + h[0].length;
  const next = /^[ \t]*\[/m.exec(t.slice(start));
  return { start, end: next ? start + next.index : t.length };
}
function watchRange(t) {
  const m = /^[ \t]*watchlist[ \t]*=[ \t]*\[[\s\S]*?\]/m.exec(t);
  return m && { start: m.index, end: m.index + m[0].length, body: m[0] };
}
function parseConfig(text) {
  const t = norm(text);
  const w = watchRange(t);
  const codes = [];
  if (w) {
    const inner = w.body.slice(w.body.indexOf("[") + 1, -1).replace(/#[^\n]*/g, "");
    for (const m of inner.matchAll(/"([^"]*)"|'([^']*)'|([^\s,"']+)/g)) {
      const c = (m[1] ?? m[2] ?? m[3]).trim().toUpperCase();
      if (c && !codes.includes(c)) codes.push(c);
    }
  }
  const lim = {};
  const r = limitsRange(t);
  if (r) {
    for (const line of t.slice(r.start, r.end).split("\n")) {
      const m = /^\s*["']?([^"'=\s#]+)["']?\s*=\s*\{(.*)\}/.exec(line);
      if (!m) continue;
      const o = {};
      for (const k of ["lower", "upper"]) {
        const x = new RegExp(`${k}\\s*=\\s*(-?[\\d.]+)`).exec(m[2]);
        if (x) o[k] = Number(x[1]);
      }
      const s = /support\s*=\s*\[([^\]]*)\]/.exec(m[2]) || /support\s*=\s*(-?[\d.]+)/.exec(m[2]);
      if (s) o.support = s[1].split(",").map((x) => Number(x.trim())).filter((x) => x > 0);
      lim[m[1].toUpperCase()] = o;
    }
  }
  return codes.map((code) => ({ code, lower: lim[code]?.lower ?? "", upper: lim[code]?.upper ?? "",
                                support: (lim[code]?.support || []).join(", ") }));
}
function buildConfig(orig, rows) {
  const num = (v) => String(Number(v));
  const entries = rows.filter((r) => r.lower !== "" || r.upper !== "" || r.support.length).map((r) => {
    const parts = [];
    if (r.lower !== "") parts.push(`lower = ${num(r.lower)}`);
    if (r.upper !== "") parts.push(`upper = ${num(r.upper)}`);
    if (r.support.length) parts.push(`support = [${r.support.map(num).join(", ")}]`);
    return `${JSON.stringify(r.code)} = { ${parts.join(", ")} }`;
  });
  let text = orig;
  // 1. [limits] 段落：保留說明（# 開頭）和空行，換掉原本每一檔的設定
  const lr = limitsRange(norm(text));
  if (lr) {
    const lines = text.slice(lr.start, lr.end).split("\n");
    const kept = lines.slice(1).filter((l) => !l.trim() || l.trim().startsWith("#"));
    text = text.slice(0, lr.start) + "\n" + [...entries, ...kept].join("\n") + text.slice(lr.end);
  } else if (entries.length) {
    const block = "[limits]\n" + entries.join("\n") + "\n\n";
    const at = /^[ \t]*\[strategy_params\]/m.exec(norm(text));
    text = at ? text.slice(0, at.index) + block + text.slice(at.index) : text.replace(/\n*$/, "\n\n") + block;
  }
  // 2. 自選股那一行（在所有 [段落] 前面）
  const line = `watchlist = [${rows.map((r) => JSON.stringify(r.code)).join(", ")}]`;
  const wr = watchRange(norm(text));
  if (wr) text = text.slice(0, wr.start) + line + text.slice(wr.end);
  else {
    const first = /^[ \t]*\[/m.exec(norm(text));
    text = first ? text.slice(0, first.index) + line + "\n\n" + text.slice(first.index) : line + "\n" + text;
  }
  return text;
}
function edSay(msg, kind = "") { ED.msg = msg; ED.msgKind = kind; drawEditor(); }
async function edLoad() {
  ED.busy = true; edSay("讀取目前的設定…");
  try {
    const j = await gh("GET");
    ED.text = b64dec(j.content); ED.sha = j.sha;
    ED.rows = parseConfig(ED.text);
    ED.busy = false; edSay("");
  } catch (e) { ED.busy = false; edSay(e.message, "err"); }
}
function readRows() {   // 從畫面上的輸入框讀回來（輸入中的值）
  document.querySelectorAll(".ed-row").forEach((row, i) => {
    for (const k of ["lower", "upper", "support"]) ED.rows[i][k] = row.querySelector(`[data-k="${k}"]`).value.trim();
  });
}
function checkRows() {
  const out = [];
  for (const r of ED.rows) {
    const lower = r.lower === "" ? "" : Number(norm(String(r.lower)));
    const upper = r.upper === "" ? "" : Number(norm(String(r.upper)));
    const support = norm(String(r.support)).split(/[,\s]+/).filter(Boolean).map(Number);
    if ((lower !== "" && !(lower > 0)) || (upper !== "" && !(upper > 0)) || support.some((x) => !(x > 0)))
      throw new Error(`${r.code} 的價格要填大於 0 的數字`);
    if (lower !== "" && upper !== "" && lower >= upper) throw new Error(`${r.code} 的下限要小於上限`);
    out.push({ code: r.code, lower, upper, support: [...new Set(support)].sort((a, b) => b - a) });
  }
  return out;
}
async function edSave() {
  readRows();
  let rows;
  try { rows = checkRows(); } catch (e) { return edSay(e.message, "err"); }
  if (!rows.length) return edSay("自選股至少要留一檔", "err");
  if (!token()) { ED.needToken = true; return edSay("第一次存檔要先設定 GitHub 權杖（看下面的步驟）", "err"); }
  const text = buildConfig(ED.text, rows);
  if (text === ED.text) return edSay("沒有變更");
  ED.busy = true; edSay("存檔中…");
  try {
    const j = await gh("PUT", { message: `手機修改自選股：${rows.map((r) => r.code).join("、")}`,
                                content: b64enc(text), sha: ED.sha });
    ED.text = text; ED.sha = j.content.sha; ED.rows = parseConfig(text); ED.needToken = false;
    ED.busy = false;
    edSay("✅ 已存到 GitHub！雲端正在重新計算，大約 2～3 分鐘後這一頁會自動更新。", "ok");
  } catch (e) { ED.busy = false; edSay(e.message, "err"); }
}
function edAdd() {
  readRows();
  const box = $("edAddCode");
  for (const raw of norm(box.value).split(/[,\s]+/).filter(Boolean)) {
    const code = raw.replace(/["']/g, "").toUpperCase();
    if (ED.rows.some((r) => r.code === code)) { edSay(`${code} 已經在自選股裡`, "err"); continue; }
    ED.rows.push({ code, lower: "", upper: "", support: "" });
    ED.msg = `已加入 ${code}，記得按「儲存」`; ED.msgKind = "";
  }
  box.value = "";
  drawEditor();
}

    }

  }

    row.append(code);
    for (const [k, label, ph] of [["lower", "下限", "不設"], ["upper", "上限", "不設"], ["support", "支撐線", "例 900, 850"]]) {

      ED.rows.splice(i, 1); ED.msg = `已刪除 ${r.code}，記得按「儲存」`; ED.msgKind = ""; drawEditor();
    };

  reload.onclick = edLoad;
  actions.append(save, reload);
  if (token()) {
    const forget = el("button", { class: "btn" }, "這支手機登出");
    forget.onclick = () => { if (confirm("刪掉這個瀏覽器記住的 GitHub 權杖？")) { token(""); edSay("已刪除權杖"); } };
    actions.append(forget);
  }
  const msg = el("p", { class: "ed-msg " + ED.msgKind }, ED.msg);
  const foot = el("p", { class: "foot" }, "下限 / 上限：突破或跌破就提醒；支撐線：昨天收盤還在線上、今天跌破就提醒，可以填好幾條（用逗號分開）。" +
    "策略、停損、自動交易等其他設定請按上面的「⚙️ 修改設定」。");

    token(v); ED.needToken = false;
    drawOrders();
    if (ED.text == null) await edLoad();
    else edSay("已記住權杖，可以按「儲存」了", "ok");
  };
  row.append(lab, ok);
  box.append(row, el("p", { class: "foot", style: "margin:6px 0 0" },
    "權杖只存在這個瀏覽器裡，不會出現在網頁或 GitHub 上；這組權杖只能改 taco0525 的檔案。手機遺失時到 GitHub 的同一頁把它刪掉就好。"));
  return box;
}
// ---------- 手動模擬下單：訂單寫進 cloud_monitor/orders.json，雲端下一次更新（約 1～3 分鐘）時成交 ----------
const ORDERS_PATH = "cloud_monitor/orders.json";
const OD = { side: "buy", busy: false, msg: "", msgKind: "", sent: [] };
function odSay(msg, kind = "") { OD.msg = msg; OD.msgKind = kind; drawOrders(); }
const OD_STATUS = { pending: "等待成交", sent: "已送出", done: "已成交", rejected: "被拒絕", expired: "已取消" };
function drawOrders() {
  const body = $("odBody");
  if (!body || !data) return;
  const keep = {};   // 保留輸入中的值
  for (const id of ["odCode", "odShares", "odAll"]) if ($(id)) keep[id] = $(id).type === "checkbox" ? $(id).checked : $(id).value;
  const held = Object.fromEntries((data.positions || []).map((p) => [p.code, p]));
  const form = el("div", { class: "od-form" });
  const codeLab = el("label", {}, "股票");
  const sel = el("select", { id: "odCode" });
  for (const w of data.watch) {
    const opt = el("option", { value: w.code }, `${w.code} ${w.name || ""}${held[w.code] ? `（持有 ${held[w.code].shares.toLocaleString()} 股）` : ""}`);
    sel.append(opt);
  }
  if (keep.odCode) sel.value = keep.odCode;
  codeLab.append(sel);
  const side = el("div", { class: "od-side", role: "group", "aria-label": "買賣" });
  for (const [k, t] of [["buy", "買進"], ["sell", "賣出"]]) {
    const b = el("button", { class: `${k} ${OD.side === k ? "on" : ""}`, type: "button" }, t);
    b.onclick = () => { OD.side = k; drawOrders(); };
    side.append(b);
  }
  const shLab = el("label", {}, "股數（1 張 = 1000 股）");
  const sh = el("input", { id: "odShares", inputmode: "numeric", placeholder: "例 1000", value: keep.odShares || "" });
  shLab.append(sh);
  form.append(codeLab, side, shLab);
  let all = null;
  if (OD.side === "sell") {
    const allLab = el("label", { style: "flex-direction:row;align-items:center;gap:4px;font-size:13px;color:var(--ink);white-space:nowrap" });
    all = el("input", { type: "checkbox", id: "odAll" });
    all.checked = keep.odAll !== undefined ? keep.odAll : true;
    allLab.append(all, document.createTextNode("全部賣出"));
    form.append(allLab);
    sh.disabled = all.checked;
    all.onchange = () => { sh.disabled = all.checked; est(); };
  }
  const send = el("button", { class: "btn primary", type: "button" }, OD.busy ? "送出中…" : (OD.side === "buy" ? "送出買單" : "送出賣單"));
  send.disabled = OD.busy;
  send.onclick = odSend;
  form.append(send);
  const estLine = el("div", { class: "od-est" });
  function est() {
    const w = data.watch.find((x) => x.code === sel.value);
    const n = parseInt(sh.value, 10);
    const p = w && w.price;
    const sellAll = all && all.checked;
    let t = p ? `目前價格 ${fmt(p)}` : "目前沒有價格";
    const qty = sellAll ? (held[sel.value]?.shares || 0) : n;
    if (OD.side === "sell" && !held[sel.value]) t += "，這檔目前沒有持股";
    else if (p && qty > 0) {
      const amt = p * qty;
      const fee = Math.max(20, amt * 0.001425);
      t += OD.side === "buy" ? `，約需 ${money(amt + fee)} 元（含手續費）；現金 ${money(data.account.cash)}`
                             : `，約可拿回 ${money(amt - fee - (w.tw ? amt * 0.003 : 0))} 元`;
    }
    estLine.textContent = t + "。實際以下一次雲端更新時的價格成交。";
  }
  sel.onchange = est; sh.oninput = est; est();
  // 訂單狀態：雲端回報的 + 剛送出、雲端還沒處理的
  const list = el("ul", { class: "od-list" });
  const known = new Set((data.orders || []).map((o) => o.id));
  const rows = [...OD.sent.filter((o) => !known.has(o.id)).map((o) => ({ ...o, status: "sent", message: "等雲端處理（約 1～3 分鐘）" })),
                ...(data.orders || [])];
  for (const o of rows.slice(0, 20)) {
    const li = el("li");
    li.append(el("span", { class: `od-st ${o.status}` }, OD_STATUS[o.status] || o.status),
              el("span", { class: "t" }, (o.handled || o.time || "").replace("T", " ").slice(5, 16)),
              el("b", {}, `${o.side === "buy" ? "買" : "賣"} ${o.code}`),
              el("span", {}, o.message || (o.shares ? `${Number(o.shares).toLocaleString()} 股` : "全部")));
    list.append(li);
  }
  if (!rows.length) list.append(el("li", { class: "empty" }, "還沒有手動訂單"));
  const msg = el("p", { class: "ed-msg " + OD.msgKind }, OD.msg);
  const foot = el("p", { class: "foot" }, "送出後雲端會馬上重新跑一次（約 1～3 分鐘），用那時候的價格成交；不在交易時間就等開盤後的第一次更新。" +
    "一樣扣手續費、賣出台股扣證交稅；現金或股數不夠會被拒絕。這是模擬下單，不會真的買賣。");
  body.replaceChildren(form, estLine, msg);
  if (!token()) body.append(tokenBox());
  body.append(list, foot);
}
async function odSend() {
  const code = $("odCode").value, sellAll = OD.side === "sell" && $("odAll") && $("odAll").checked;
  const shares = sellAll ? null : parseInt($("odShares").value, 10);
  if (!code) return odSay("請選一檔股票", "err");
  if (!sellAll && !(shares > 0)) return odSay("請輸入股數（1 張 = 1000 股）", "err");
  if (OD.side === "sell" && !(data.positions || []).some((p) => p.code === code)) return odSay(`${code} 目前沒有持股，不能賣`, "err");
  if (!token()) { ED.needToken = true; return odSay("第一次下單要先設定 GitHub 權杖（看下面的步驟）", "err"); }
  const what = `${OD.side === "buy" ? "買進" : "賣出"} ${code} ${sellAll ? "全部" : shares.toLocaleString() + " 股"}`;
  OD.busy = true; odSay(`送出「${what}」…`);
  try {
    const now = new Date();
    const order = { id: `${now.getTime().toString(36)}-${Math.random().toString(36).slice(2, 6)}`,
                    time: new Date(now.getTime() + 8 * 3600e3).toISOString().slice(0, 19),   // 台北時間
                    code, side: OD.side, shares };
    for (let attempt = 0; attempt < 2; attempt++) {   // 剛好有別的修改時重試一次
      const cur = await gh("GET", null, ORDERS_PATH);
      let list = [];
      try { list = cur ? JSON.parse(b64dec(cur.content)) : []; } catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      // 已經處理完的舊訂單從檔案裡拿掉（結果留在雲端的紀錄裡），檔案才不會越來越長
      const finished = new Set((data.orders || []).filter((o) => o.status !== "pending").map((o) => o.id));
      list = list.filter((o) => !finished.has(o.id)).concat([order]);
      try {
        await gh("PUT", { message: `手機模擬下單：${what}`, content: b64enc(JSON.stringify(list, null, 1) + "\n"),
                          ...(cur ? { sha: cur.sha } : {}) }, ORDERS_PATH);
        break;
      } catch (e) {
        if (attempt || !/別的地方被改過/.test(e.message)) throw e;
      }
    }
    OD.sent.unshift(order); OD.busy = false;
    if ($("odShares")) $("odShares").value = "";
    odSay(`✅ 已送出「${what}」，雲端約 1～3 分鐘後成交，這一頁會自動更新。`, "ok");
  } catch (e) { OD.busy = false; odSay(e.message, "err"); }
}
$("orderPanel").addEventListener("toggle", () => { if ($("orderPanel").open) drawOrders(); });

$("editor").addEventListener("toggle", () => { if ($("editor").open && ED.text == null && !ED.busy && data) edLoad(); });

applyPrefs();
load();
setInterval(load, 60000);
setInterval(() => { showUpdated(); if (data) $("watch").replaceChildren(...data.watch.map(watchCard)); }, 30000);
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => data && equityChart($("equity"), data.equity, data.account.initial), 200); });
</script>
